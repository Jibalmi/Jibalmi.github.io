<!doctype html><meta charset="utf-8"><title>render</title>
<style>html,body{margin:0;background:#0b0b0c}canvas{display:block;width:100vw;height:100vh}</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './vendor/jsm/GLTFLoader.js';
const q = new URLSearchParams(location.search);
const src = q.get('src'), az = +(q.get('az') ?? 35), el = +(q.get('el') ?? 22), ex = +(q.get('ex') ?? 0), zoom = +(q.get('zoom') ?? 1);
const meta = q.get('meta');
const cv = document.getElementById('c');
const r = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
r.setPixelRatio(1); r.setSize(innerWidth, innerHeight, false); r.outputColorSpace = THREE.SRGBColorSpace;
const sc = new THREE.Scene();
sc.background = new THREE.Color(0x0b0b0c);
sc.add(new THREE.HemisphereLight(0xe8eeff, 0x4a4a58, 2.3));
const k = new THREE.DirectionalLight(0xffffff, 3.4); k.position.set(3, 5, 4); sc.add(k);
const rim = new THREE.DirectionalLight(0xff8a63, 2.0); rim.position.set(-4, 1, -3); sc.add(rim);
const cam = new THREE.PerspectiveCamera(28, innerWidth / innerHeight, 0.001, 100);
const g = await new GLTFLoader().loadAsync(src);
const parts = meta ? await fetch(meta).then(x => x.json()).catch(() => ({})) : {};
const root = g.scene; const palette = [0xc9ccd6, 0x9aa3b5, 0x6f7a90, 0xff5b2e];
let ci = 0; const kill = [];
root.traverse(o => { if (o.isMesh) {
  if (!o.geometry.attributes.normal) o.geometry.computeVertexNormals();
  let base = o.material && o.material.color ? o.material.color.clone() : new THREE.Color(palette[ci++ % 4]);
  const lum = 0.2126 * base.r + 0.7152 * base.g + 0.0722 * base.b;
  if (lum < 0.22) base.lerp(new THREE.Color(0x9aa0b0), 0.42 - lum);
  const tr = o.material && (o.material.transparent || o.material.opacity < 1);
  if (tr) { kill.push(o); return; }
  o.material = new THREE.MeshStandardMaterial({ color: base, metalness: 0.3, roughness: 0.5, side: THREE.DoubleSide });
  o.add(new THREE.LineSegments(new THREE.EdgesGeometry(o.geometry, 28), new THREE.LineBasicMaterial({ color: 0xc8ccd8, transparent: true, opacity: 0.22 })));
}});
kill.forEach(o => o.parent && o.parent.remove(o));
const pp = (parts.parts) || {};
root.children.forEach(o => { const d = (pp[o.name] || {}).explode || [0, 0, 0]; o.position.x += d[0] * ex; o.position.y += d[1] * ex; o.position.z += d[2] * ex; });
const box = new THREE.Box3().setFromObject(root), c = box.getCenter(new THREE.Vector3()), sz = box.getSize(new THREE.Vector3());
root.position.sub(c); sc.add(root);
const R = box.getBoundingSphere(new THREE.Sphere()).radius / zoom;
const a = az * Math.PI / 180, e = el * Math.PI / 180, dist = R / Math.sin(14 * Math.PI / 180) * 1.08;
cam.position.set(dist * Math.cos(e) * Math.sin(a), dist * Math.sin(e), dist * Math.cos(e) * Math.cos(a));
cam.lookAt(0, 0, 0);
r.render(sc, cam);
document.title = 'ready';
</script>
